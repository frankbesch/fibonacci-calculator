<svg viewBox="0 0 360 452" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Four ways to compute F(n)</title>
<desc>Four methods, all exact with BigInt. recursive adds F(n - 1) and F(n - 2) and recomputes both, about 2^n calls, so it runs only for small n. iterative walks up from F(0) and F(1) in n additions. memoized extends a shared table once, then looks values up. fastDoubling builds F(2k) and F(2k + 1) from F(k) and F(k + 1), in about log n steps. A JavaScript Number is exact only to 2^53, so it reads F(79) as 14,472,334,024,676,220; the exact value ends in 221.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="452" rx="6" fill="#0E1C2B"/>
<text x="16" y="30" font-size="15" fill="#E8E2D6" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Four ways to compute F(n)</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#2D4152"/>
<rect x="16" y="56" width="328" height="70" rx="5" fill="#1F3142" stroke="#D17276" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">recursive</text>
<text x="180" y="97" font-size="12" fill="#A8A296" text-anchor="middle">F(n - 1) + F(n - 2), recomputed</text>
<text x="180" y="113" font-size="12" fill="#E8E2D6" text-anchor="middle">2^n calls: n = 30 only</text>
<rect x="16" y="140" width="328" height="70" rx="5" fill="#1F3142" stroke="#6DA361" stroke-width="1.5"/>
<text x="180" y="163" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">iterative</text>
<text x="180" y="181" font-size="12" fill="#A8A296" text-anchor="middle">walk up from F(0) and F(1)</text>
<text x="180" y="197" font-size="12" fill="#E8E2D6" text-anchor="middle">n additions</text>
<rect x="16" y="224" width="328" height="70" rx="5" fill="#1F3142" stroke="#559ACA" stroke-width="1.5"/>
<text x="180" y="247" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">memoized</text>
<text x="180" y="265" font-size="12" fill="#A8A296" text-anchor="middle">extend a shared table</text>
<text x="180" y="281" font-size="12" fill="#E8E2D6" text-anchor="middle">n once, then a lookup</text>
<rect x="16" y="308" width="328" height="70" rx="5" fill="#1F3142" stroke="#17A1C8" stroke-width="1.5"/>
<text x="180" y="331" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">fastDoubling</text>
<text x="180" y="349" font-size="12" fill="#A8A296" text-anchor="middle">F(2k), F(2k + 1) from F(k), F(k + 1)</text>
<text x="180" y="365" font-size="12" fill="#E8E2D6" text-anchor="middle">log n steps</text>
<text x="16" y="418" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>All four are exact with BigInt. A JavaScript Number reads</text>
<text x="16" y="435" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>F(79) as ...220; the exact value ends in 221.</text>
</svg>
