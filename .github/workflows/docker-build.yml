name: Docker Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Extract version
      id: version
      run: echo "VERSION=$(cat package.json | grep version | cut -d '"' -f 4)" >> $GITHUB_OUTPUT
    
    - name: Build Docker image
      run: |
        docker build -t fibonacci-app:${{ steps.version.outputs.VERSION }} .
        docker build -t fibonacci-app:latest .
    
    - name: Test image
      run: |
        docker run -d -p 8080:8080 --name test-app fibonacci-app:latest
        sleep 5
        curl -f http://localhost:8080 || exit 1
        docker stop test-app

