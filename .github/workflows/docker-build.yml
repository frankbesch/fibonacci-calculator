name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

env:
  OCI_REGION: us-chicago-1
  OCIR_NAMESPACE: axsbuwrxhysd
  IMAGE_NAME: fibonacci-app
  OKE_CLUSTER_ID: ocid1.cluster.oc1.us-chicago-1.aaaaaaaag637h4fhp6gs3sk7e2nhd5tlblbvmnmwjrh2gatvzcz5cq4xpg3q

jobs:
  build-and-push:
    name: Build, Test & Push to OCIR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Extract version from package.json
      id: version
      run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t fibonacci-app:${{ steps.version.outputs.VERSION }} .
        docker build -t fibonacci-app:latest .
    
    - name: Test Docker image
      run: |
        docker run -d -p 8080:8080 --name test-app fibonacci-app:latest
        sleep 5
        curl -f http://localhost:8080 || exit 1
        docker stop test-app
        docker rm test-app
    
    - name: Log in to OCIR
      if: github.event_name != 'pull_request'
      run: |
        echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login ${{ env.OCI_REGION }}.ocir.io \
          --username ${{ env.OCIR_NAMESPACE }}/${{ secrets.OCI_USERNAME }} \
          --password-stdin
    
    - name: Tag and push to OCIR
      if: github.event_name != 'pull_request'
      run: |
        docker tag fibonacci-app:${{ steps.version.outputs.VERSION }} \
          ${{ env.OCI_REGION }}.ocir.io/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
        docker tag fibonacci-app:latest \
          ${{ env.OCI_REGION }}.ocir.io/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
        
        docker push ${{ env.OCI_REGION }}.ocir.io/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
        docker push ${{ env.OCI_REGION }}.ocir.io/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
  
  deploy-to-oke:
    name: Deploy to OKE
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install OCI CLI
      run: |
        curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o install.sh
        bash install.sh --accept-all-defaults
        echo "$HOME/bin" >> $GITHUB_PATH
    
    - name: Configure OCI CLI
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem
        
        cat > ~/.oci/config <<EOF
        [DEFAULT]
        user=${{ secrets.OCI_CLI_USER }}
        fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
        tenancy=${{ secrets.OCI_CLI_TENANCY }}
        region=${{ env.OCI_REGION }}
        key_file=~/.oci/oci_api_key.pem
        EOF
    
    - name: Set up kubectl
      run: |
        oci ce cluster create-kubeconfig \
          --cluster-id ${{ env.OKE_CLUSTER_ID }} \
          --file $HOME/.kube/config \
          --region ${{ env.OCI_REGION }} \
          --token-version 2.0.0 \
          --kube-endpoint PUBLIC_ENDPOINT
    
    - name: Create OCIR secret
      run: |
        kubectl create secret docker-registry ocir-secret \
          --docker-server=${{ env.OCI_REGION }}.ocir.io \
          --docker-username=${{ env.OCIR_NAMESPACE }}/${{ secrets.OCI_USERNAME }} \
          --docker-password="${{ secrets.OCI_AUTH_TOKEN }}" \
          --docker-email=${{ secrets.OCI_EMAIL }} \
          --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Deploy to OKE
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl rollout status deployment/fibonacci-app --timeout=5m
    
    - name: Get service URL
      run: |
        echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Services:**" >> $GITHUB_STEP_SUMMARY
        kubectl get svc fibonacci-app -o json | \
          jq -r '"- LoadBalancer: http://\(.status.loadBalancer.ingress[0].ip)/"' >> $GITHUB_STEP_SUMMARY
