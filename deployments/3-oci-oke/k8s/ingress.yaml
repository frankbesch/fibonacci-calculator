apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fibonacci-app-ingress
  labels:
    app: fibonacci-app
    version: v2025.09.10
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: fibonacci-app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fibonacci-app-service
            port:
              number: 80
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fibonacci-app-service
            port:
              number: 80
