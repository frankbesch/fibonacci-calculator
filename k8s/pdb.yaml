# ============================================================================
# Pod Disruption Budget - High Availability Protection
# ============================================================================
# Last Updated: 2025-10-10
# Version: 1.0.0
#
# Purpose: Ensure at least 1 pod is always available during:
#   - Node maintenance
#   - Cluster upgrades
#   - Voluntary pod evictions
#
# Min Available: 1 pod (prevents total downtime)
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fibonacci-app-pdb
  labels:
    app: fibonacci-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fibonacci-app
