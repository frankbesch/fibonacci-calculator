# ============================================================================
# Horizontal Pod Autoscaler - Cost-Optimized Scaling
# ============================================================================
# Last Updated: 2025-10-10
# Version: 1.0.0
#
# Configuration:
#   - Min Replicas: 2 (for HA)
#   - Max Replicas: 6 (cost-controlled)
#   - CPU Target: 50% utilization
#   - Memory Target: 60% utilization
#
# Scale-up: Fast (60s stabilization)
# Scale-down: Gradual (300s stabilization, 50% reduction)
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fibonacci-app-hpa
  labels:
    app: fibonacci-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fibonacci-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
