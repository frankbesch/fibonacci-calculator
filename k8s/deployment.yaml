apiVersion: apps/v1
kind: Deployment
metadata:
  name: fibonacci-app
  labels:
    app: fibonacci-app
    version: v2025.09.10
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fibonacci-app
  template:
    metadata:
      labels:
        app: fibonacci-app
        version: v2025.09.10
    spec:
      containers:
      - name: fibonacci-app
        image: us-chicago-1.ocir.io/axsbuwrxhysd/fibonacci-app:v2025.09.10
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: ocir-secret
---
apiVersion: v1
kind: Service
metadata:
  name: fibonacci-app
  labels:
    app: fibonacci-app
spec:
  type: LoadBalancer
  selector:
    app: fibonacci-app
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
