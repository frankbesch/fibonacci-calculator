apiVersion: v1
kind: Namespace
metadata:
  name: fibonacci-app
  labels:
    name: fibonacci-app
    app: fibonacci-calculator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fibonacci-app
  namespace: fibonacci-app
  labels:
    app: fibonacci-calculator
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fibonacci-calculator
  template:
    metadata:
      labels:
        app: fibonacci-calculator
        version: v1.0.0
    spec:
      containers:
      - name: fibonacci-app
        image: ord.ocir.io/ocid1.tenancy.oc1..aaaaaaaaw2z4q2j3bkh6s2nh6apjezrv64i4wlr3er2pwwwhixs6x65f2vzq/fibonacci-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1001
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: fibonacci-app-service
  namespace: fibonacci-app
  labels:
    app: fibonacci-calculator
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: fibonacci-calculator
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fibonacci-app-ingress
  namespace: fibonacci-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fibonacci-app.yourdomain.com
    secretName: fibonacci-app-tls
  rules:
  - host: fibonacci-app.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fibonacci-app-service
            port:
              number: 80
