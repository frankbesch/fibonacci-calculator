apiVersion: v1
kind: ConfigMap
metadata:
  name: fibonacci-app-config
  namespace: fibonacci-app
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
        
        server {
            listen 8080;
            server_name localhost;
            root /usr/share/nginx/html;
            index index.html;
            
            location / {
                try_files $uri $uri/ /index.html;
            }
            
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: fibonacci-app-secrets
  namespace: fibonacci-app
type: Opaque
data:
  # Base64 encoded values - replace with your actual values
  api-key: ""  # echo -n "your-api-key" | base64
  database-url: ""  # echo -n "your-db-url" | base64
